[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maintenance-intelligence"
version = "0.1.0"
description = "Grounded ingestion pipeline for industrial maintenance manuals"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "psycopg[binary]>=3.2,<4",
  "prometheus-client>=0.21,<1",
  "PyMuPDF>=1.24,<2",
  "qdrant-client[fastembed]>=1.14.2,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[project.scripts]
maintenance-ingest = "maintenance_intelligence.cli:main"
maintenance-evaluate = "maintenance_intelligence.evaluate_cli:main"
maintenance-evaluate-full = "maintenance_intelligence.evaluate_full_cli:main"
maintenance-index = "maintenance_intelligence.index_cli:main"
maintenance-visual-inventory = "maintenance_intelligence.visual_cli:main"
maintenance-visual-sample = "maintenance_intelligence.visual_sample_cli:main"
maintenance-visual-evaluate = "maintenance_intelligence.visual_evaluate_cli:main"
maintenance-visual-retrieval-evaluate = "maintenance_intelligence.visual_retrieval_cli:main"
maintenance-visual-clip-evaluate = "maintenance_intelligence.visual_clip_cli:main"
maintenance-api = "maintenance_intelligence.api_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maintenance_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
